services:
  - type: web
    name: nexa-grid-auth
    runtime: node
    plan: starter            # persistent disks need a paid instance
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/app.db
      - key: REDIRECT_URL
        value: https://reyyanabbas.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://reyyanabbas.vercel.app
      - key: PUBLIC_URL
        sync: false          # set to your https://<service>.onrender.com URL
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
